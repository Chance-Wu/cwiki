[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cwiki"
version = "0.1.0"
description = "Agent Persistent Memory & Knowledge Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-ulid>=3.0.0",
    "orjson>=3.10.0",
    "openai>=1.50.0",
    "numpy>=2.0.0",
    "jieba>=0.42.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "watchdog>=5.0.0",
    "onnxruntime>=1.17.0",
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "adapters"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "skills",
    "cwiki-data",  # user memory data (markdown code blocks are not source)
]

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends/Query/Body in default arguments is intentional
    "BLE001",  # Blind except Exception is used intentionally for error handling
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
